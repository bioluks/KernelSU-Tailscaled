name: Publish Verified Source Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v3 tag to publish
        required: true
        type: string
      build_run_id:
        description: Run containing a successful build job and verified packages
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: source-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      startsWith(inputs.tag, 'v3.') &&
      (contains(inputs.tag, '-') || vars.STABLE_RELEASE_APPROVED == 'true')
    runs-on: ubuntu-latest
    environment: source-release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify build provenance and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BUILD_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test "$RELEASE_TAG" = "v$(sed -n 's/^version=//p' module.prop)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads(Path('build-run.json').read_text())
          jobs = json.loads(Path('build-jobs.json').read_text())['jobs']
          assert run['head_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/release.yml'
          build = next(job for job in jobs if job['name'] == 'build' and job['conclusion'] == 'success')
          assert any(step['name'] == 'Build signed release companion' and step['conclusion'] == 'success'
                     for step in build['steps'])
          assert not any(step['name'] == 'Build debug companion' and step['conclusion'] == 'success'
                         for step in build['steps'])
          PY

      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: KernelSU-Tailscaled-packages
          path: dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Require exact release asset set
        run: |
          python - <<'PY'
          from pathlib import Path
          version = next(line.split('=', 1)[1] for line in Path('module.prop').read_text().splitlines()
                         if line.startswith('version='))
          expected = {f'KernelSU-Tailscaled-v{version}.zip',
                      f'KernelSU-Tailscaled-arm-v{version}.zip',
                      f'KernelSU-Tailscaled-arm64-v{version}.zip',
                      f'KernelSU-Tailscaled-companion-v{version}.apk'}
          files = list(Path('dist').iterdir())
          assert {path.name for path in files} == expected
          assert all(path.is_file() and path.stat().st_size > 0 for path in files)
          PY

      - name: Require immutable-release configuration
        env:
          GH_TOKEN: ${{ secrets.SOURCE_RELEASE_READ_TOKEN }}
          IMMUTABILITY_CONFIRMED: ${{ vars.SOURCE_IMMUTABILITY_CONFIRMED }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          else
            test "$IMMUTABILITY_CONFIRMED" = true
          fi

      - name: Publish or resume the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! release_id=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId); then
            flags=()
            case "$RELEASE_TAG" in *-*) flags+=(--prerelease --latest=false) ;; esac
            notes_file="docs/releases/$RELEASE_TAG.md"
            [ -f "$notes_file" ] || notes_file=CHANGELOG.txt
            gh release create "$RELEASE_TAG" dist/*.zip -R "$GITHUB_REPOSITORY" \
              --verify-tag --draft "${flags[@]}" \
              --title "KernelSU-Tailscaled $RELEASE_TAG" --notes-file "$notes_file"
            release_id=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          fi
          case "$release_id" in ''|*[!0-9]*) exit 1 ;; esac
          endpoint="repos/$GITHUB_REPOSITORY/releases/$release_id"
          apk="dist/KernelSU-Tailscaled-companion-${RELEASE_TAG}.apk"
          apk_count=$(gh api "$endpoint" --jq '[.assets[].name | select(endswith(".apk"))] | length')
          if [ "$apk_count" = 0 ] && [ "$(gh api "$endpoint" --jq .draft)" = true ]; then
            upload_url=$(gh api "$endpoint" --jq .upload_url)
            upload_url=${upload_url%%\{*}
            gh api --method POST "$upload_url?name=${apk##*/}" \
              --header 'Content-Type: application/vnd.android.package-archive' \
              --input "$apk" > /dev/null
          fi
          gh api "$endpoint" > release.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          files = {p.name: p for p in Path('dist').iterdir()}
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert len(files) == 4 and {a['name'] for a in release['assets']} == files.keys()
          assert len(release['assets']) == len(files)
          for asset in release['assets']:
              expected_mime = (('application/vnd.android.package-archive',) if asset['name'].endswith('.apk')
                               else ('application/zip', 'application/x-zip-compressed'))
              assert asset['content_type'] in expected_mime
              assert asset['digest'] == 'sha256:' + hashlib.sha256(files[asset['name']].read_bytes()).hexdigest()
          PY
          if [ "$(gh api "$endpoint" --jq .draft)" = true ]; then
            flags=()
            case "$RELEASE_TAG" in
              *-*) flags+=(--prerelease --latest=false) ;;
              *) flags+=(--prerelease=false --latest) ;;
            esac
            gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          fi
          test "$(gh api "$endpoint" --jq .immutable)" = true
          for archive in dist/*.zip dist/*.apk; do
            attempt=0
            until gh release verify-asset "$RELEASE_TAG" "$archive" -R "$GITHUB_REPOSITORY"; do
              attempt=$((attempt + 1))
              [ "$attempt" -lt 6 ] || exit 1
              # GitHub may publish the release before its attestation is readable.
              sleep 5
            done
          done
