name: Build, Verify, and Release

on:
  push:
    branches: [all-features-merged, main, "feature/**"]
    tags: ["v3.*"]
  pull_request:
    branches: [all-features-merged, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webroot-src/package-lock.json

      - name: Install frontend dependencies
        working-directory: webroot-src
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Python contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y mksh busybox
          python -m unittest discover -s tests -v

      - name: Verify frontend
        working-directory: webroot-src
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify WebUI in desktop and mobile browsers
        working-directory: webroot-src
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Verify committed WebUI build
        run: git diff --exit-code -- webroot

      - name: Verify shell scripts
        run: |
          find tailscale/scripts -type f ! -name '*.awk' -print0 | xargs -0 -n1 sh -n
          find scripts -name '*.sh' -print0 | xargs -0 -n1 sh -n
          shellcheck --version
          shellcheck --exclude=SC1090,SC1091,SC2034 \
            control.sh customize.sh service.sh action.sh uninstall.sh scripts/*.sh
          find tailscale/scripts -type f ! -name '*.awk' -print0 | \
            xargs -0 shellcheck --exclude=SC1090,SC1091,SC2034

      - name: Verify binary manifest
        run: sha256sum --check files/manifest.sha256

      - name: Build packages
        run: sh scripts/build-release.sh --use-existing-binaries --output dist

      - name: Verify packages
        run: |
          version=$(sed -n 's/^version=//p' module.prop)
          python scripts/verify-package.py \
            --zip "dist/KernelSU-Tailscaled-v${version}.zip" --arch all
          python scripts/verify-package.py \
            --zip "dist/KernelSU-Tailscaled-arm-v${version}.zip" --arch arm
          python scripts/verify-package.py \
            --zip "dist/KernelSU-Tailscaled-arm64-v${version}.zip" --arch arm64

      - name: Verify reproducible package bytes
        run: |
          sha256sum dist/*.zip | sed 's#dist/##' > /tmp/first-build.sha256
          rm -rf dist
          sh scripts/build-release.sh --use-existing-binaries --output dist
          sha256sum dist/*.zip | sed 's#dist/##' > /tmp/second-build.sha256
          diff -u /tmp/first-build.sha256 /tmp/second-build.sha256

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug companion
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
        run: |
          python android/build.py --debug
          cp android/build/companion-unsigned.apk "$RUNNER_TEMP/companion-first-unsigned.apk"
          python android/build.py --debug
          cmp "$RUNNER_TEMP/companion-first-unsigned.apk" android/build/companion-unsigned.apk

      - name: Build signed release companion
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE: ${{ runner.temp }}/companion-release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, binascii, os
          required = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEY_ALIAS',
                      'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Release signing secrets are required; refusing debug signing')
          try:
              keystore = base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('Invalid release keystore encoding') from None
          if not keystore:
              raise SystemExit('Release keystore must not be empty')
          fd = os.open(os.environ['ANDROID_KEYSTORE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(keystore)
          PY
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version=//p' module.prop)"
          python android/build.py
          cp android/build/companion-unsigned.apk "$RUNNER_TEMP/companion-first-unsigned.apk"
          python android/build.py
          cmp "$RUNNER_TEMP/companion-first-unsigned.apk" android/build/companion-unsigned.apk

      - name: Remove release signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/companion-release.keystore"

      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Tailscaled-packages
          path: |
            dist/*.zip
            dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v3.') &&
      (contains(github.ref_name, '-') || vars.STABLE_RELEASE_APPROVED == 'true')
    needs: build
    uses: ./.github/workflows/publish-source.yml
    with:
      tag: ${{ github.ref_name }}
      build_run_id: ${{ github.run_id }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
